name: Update OSS stats

on:
  schedule:
    - cron: "45 2 * * *"   # daily, after the profile README's own update
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-oss-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recount merged and open upstream PRs
        run: python3 scripts/update_oss_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update OSS stats"
          git push
